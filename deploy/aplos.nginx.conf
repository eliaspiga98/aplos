# Aplo's — nginx server block.
#
# Installazione:
#   sudo cp deploy/aplos.nginx.conf /etc/nginx/sites-available/aplos
#   sudo ln -sf /etc/nginx/sites-available/aplos /etc/nginx/sites-enabled/aplos
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prima di abilitare HTTPS assicurati che esistano i file:
#   /etc/aplos/ssl/aplos.crt   (certificato, anche self-signed)
#   /etc/aplos/ssl/aplos.key   (chiave privata, mode 600 owner root)
# Vedi scripts/generate-cert.sh per generarne uno self-signed (LAN, no
# dominio pubblico → Let's Encrypt non è applicabile).

# Redirect HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Solo per il challenge ACME futuro, se un giorno si esponesse un dominio
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/aplos/ssl/aplos.crt;
    ssl_certificate_key /etc/aplos/ssl/aplos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Static frontend (SPA build)
    root  /opt/aplos/web/dist;
    index index.html;

    # Limite upload deve essere >= UPLOAD_MAX_BYTES dell'API (default 50MB).
    # Lasciamo un piccolo margine per overhead multipart.
    client_max_body_size 60M;
    client_body_timeout 120s;

    # Compressione asset statici
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers (HSTS attivata solo se hai un cert affidabile —
    # con self-signed lascia commentata per non sbattere fuori i client).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → Fastify
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Asset con hash → cache aggressiva (Vite produce nomi con hash)
    location /assets/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: ogni path non-asset serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
